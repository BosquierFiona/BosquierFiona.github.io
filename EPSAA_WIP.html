<script>

document.addEventListener("DOMContentLoaded", () => {

  const galerie = document.querySelector(".ligne_bas");
  const miniatures = document.querySelectorAll(".colonne_images a");
  const images = [...galerie.querySelectorAll("img")];

  // Navigation au clic sur les miniatures
  miniatures.forEach(miniature => {
    miniature.addEventListener("click", event => {
      event.preventDefault();

      const idImage = miniature.getAttribute("href");
      const image = document.querySelector(idImage);

      if (!image) return;

      galerie.scrollTo({
        top: image.offsetTop,
        behavior: "smooth"
      });
    });
  });

  // Mise à jour de la miniature active
  function actualiserMiniatures() {

    const position = galerie.scrollTop + 5;
    let indexActif = 0;

    images.forEach((image, index) => {
      if (image.offsetTop <= position) {
        indexActif = index;
      }
    });

    miniatures.forEach((miniature, index) => {
      miniature.classList.toggle("active", index === indexActif);
    });
  }

  galerie.addEventListener("scroll", actualiserMiniatures);

  images.forEach(image => {
    image.addEventListener("load", actualiserMiniatures);
  });

  actualiserMiniatures();

});

</script>
